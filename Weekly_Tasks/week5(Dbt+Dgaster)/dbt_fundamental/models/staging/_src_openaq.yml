sources:
  - name: openaq_dataset_4_resource
    tables:
      - name: _dlt_loads
      - name: _dlt_pipeline_state
      - name: _dlt_version
      - name: countries
      - name: countries__parameters
      - name: dim_locations
      - name: dim_measurements
      - name: locations 
        columns:
          - name: ID
            data_tests:
              - unique 
              - not_null
        config:
          freshness:
            warn_after : 
              count: 24
              period: hour 
            error_after : 
              count: 48
              period: day 
          loaded_at_field: ETL_LOADED_AT
      - name: locations__bounds
      - name: locations__instruments
      - name: locations__licenses
      - name: locations__sensors
      - name: measurements
        config:
          freshness:
            warn_after : 
              count: 24
              period: day
            error_after : 
              count: 48
              period: day
          
          loaded_at_field: ETL_LOADED_AT
      - name: owner
      - name: sensors
     

# -- build command
# -- dbt build
# -- dbt run
# -- dbt test
# -- dbt seed
# -- dbt snapshots
# -- test at each layer and then move to next 
# -- if test passed then move t next layer
# -- Saves Costs: If a model fails its tests, dbt automatically skips building any downstream models that depend on it.